name: Conferir links das fontes

# Semanal e separado do deploy: sítios externos caem por motivos alheios ao curso.
# Link quebrado abre uma issue; aviso (403 a robôs, por exemplo) só aparece no relatório.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: conf
        run: python tools/check_links.py relatorio.md
        continue-on-error: true
      - if: steps.conf.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Links quebrados nas fontes ($(date +%F))" --body-file relatorio.md
