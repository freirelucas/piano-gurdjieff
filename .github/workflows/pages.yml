name: Verificar e publicar

# Publica no GitHub Pages SÓ depois de: contrato do conteúdo, testes do núcleo, build e teste de fumaça
# em navegador real. Pull requests rodam a verificação inteira, sem publicar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install jsonschema==4.23.0
      - name: Contrato do conteúdo (esquema, referências, nenhum número digitado à mão)
        run: python tools/check_conteudo.py
      - name: Testes do núcleo (afinação, marcação, detector de altura, conteúdo)
        run: for f in tests/*.test.mjs; do node "$f" || exit 1; done
      - name: Build (_site + service worker com hash de conteúdo)
        run: python build.py
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Versões
        run: echo "::notice title=versões::node $(node -v) · $(timeout 60 npx playwright --version)"
      - name: Servidor estático responde
        run: |
          python -m http.server 8099 --directory _site > /tmp/srv.log 2>&1 &
          SRV=$!
          sleep 2
          for u in index.html js/main.js data/modulos.json sw.js downloads/sete_tons.scl; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099/$u"); echo "::notice title=servidor::$u → $code"
            test "$code" = 200
          done
          kill $SRV; sleep 1
      - name: Teste de fumaça em navegador (todas as rotas, sem erro de console)
        run: |
          set +e
          timeout -k 10 300 npx playwright test --reporter=line,json > /tmp/pw.log 2>&1
          rc=$?
          echo "::notice title=log da fumaça::$(wc -c < /tmp/pw.log) bytes, saída $rc"
          if [ $rc -ne 0 ]; then
            echo "::error title=fumaça::playwright saiu com $rc"
            tail -c 3500 /tmp/pw.log | sed 's/\x1b\[[0-9;]*m//g' | python -c "import sys;print('::error title=log da fumaça::'+sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $rc
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/pw.json
          DEBUG: pw:webserver
      - name: Falhas da fumaça como anotações
        if: failure()
        run: node tools/anotar_playwright.mjs /tmp/pw.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with: { path: _site }

  publicar:
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
